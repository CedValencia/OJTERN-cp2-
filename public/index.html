<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>
      OJTERN
    </title>

    <!-- SEO -->
    <meta
      name="description"
      content="OJTERN connects students, companies, and professionals through training, opportunities, and career development."
    />

    <!-- Open Graph / Facebook / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ojtern.com/" />
    <meta
      property="og:title"
      content="OJTERN — Online Job Training and Employment Resource Network"
    />
    <meta
      property="og:description"
      content="OJTERN connects students, companies, and professionals through training, opportunities, and career development."
    />
    <meta
      property="og:image"
      content="https://ojtern.com/ojtern-preview.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://ojtern.com/ojtern-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OJTERN — Online Job Training and Employment Resource Network"
    />
    <meta property="og:site_name" content="OJTERN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OJTERN — Online Job Training and Employment Resource Network"
    />
    <meta
      name="twitter:description"
      content="OJTERN connects students, companies, and professionals through training, opportunities, and career development."
    />
    <meta
      name="twitter:image"
      content="https://ojtern.com/ojtern-preview.png"
    />
    <meta
      name="twitter:image:alt"
      content="OJTERN — Online Job Training and Employment Resource Network"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#1e293b" />

    <!-- Favicon
         The .ico covers the address bar and tab (16/32/48px inside one file).
         The PNGs are what fix the blurry icon in Chrome's site dropdown,
         bookmarks and new-tab tiles: without them Chrome has only the small
         .ico to work with and stretches it. The apple-touch-icon is used when
         the site is saved to an iPhone/iPad home screen. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/ojtern_192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/ojtern_512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
