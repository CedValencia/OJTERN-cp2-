<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>OJTERN — Online Job Training and Employment Resource Network</title>

    <!-- SEO -->
    <meta
      name="description"
      content="OJTERN connects students, companies, and professionals through training, opportunities, and career development."
    />

    <!-- Open Graph / Facebook / Messenger -->
    <meta
      property="og:title"
      content="OJTERN — Online Job Training and Employment Resource Network"
    />

    <meta
      property="og:description"
      content="OJTERN connects students, companies, and professionals through training, opportunities, and career development."
    />

    <meta
      property="og:image"
      content="https://ojtern.com/ojtern-preview.png"
    />

    <meta
      property="og:url"
      content="https://ojtern.com/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="OJTERN"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="OJTERN — Online Job Training and Employment Resource Network"
    />

    <meta
      name="twitter:description"
      content="OJTERN connects students, companies, and professionals through training, opportunities, and career development."
    />

    <meta
      name="twitter:image"
      content="https://ojtern.com/ojtern-preview.png"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#1e293b"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
